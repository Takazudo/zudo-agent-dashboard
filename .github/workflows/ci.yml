name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PTY test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bash scripts/check.sh
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-deps dist/*.whl
      - name: Verify installed setup runner outside checkout
        working-directory: '${{ runner.temp }}'
        run: |
          python -m zudo_agent.setup verify-synthetic --provider claude
          python -m zudo_agent.setup verify-synthetic --provider codex
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser PTY fixture dependency
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-ui-screenshots
          path: test-results/
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/check.sh
      - run: python -m pip wheel --no-deps --wheel-dir dist .
