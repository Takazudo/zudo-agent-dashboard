[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zudo-agent-dashboard"
version = "0.1.0"
description = "Read-only, local-first agent observation dashboard"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zudo-agent = "zudo_agent.cli:main"
zudo-agent-setup = "zudo_agent.setup:main"

[tool.setuptools.package-data]
zudo_agent = ["web/*"]

[tool.setuptools.packages.find]
include = ["zudo_agent*"]
